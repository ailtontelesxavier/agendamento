[project]
name = "medcare-agendamento-backend"
version = "0.1.0"
description = "Backend FastAPI para agendamento MedCare com arquitetura hexagonal."
readme = "READMIN.md"
requires-python = ">=3.13,<4.0"
authors = [{ name = "MedCare", email = "dev@medcare.local" }]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.7.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "fastapi-users[sqlalchemy]>=14.0,<15.0",
    "alembic>=1.14,<2.0",
]

[tool.poetry]
name = "medcare-agendamento-backend"
version = "0.1.0"
description = "Backend FastAPI para agendamento MedCare com arquitetura hexagonal."
authors = ["MedCare <dev@medcare.local>"]
packages = [{ include = "medcare" }]

[project.scripts]
medcare-create-user = "medcare.cli.create_user:main"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"
pytest = "^8.2.0"
pytest-asyncio = "^0.25.0"
poetry-plugin-shell = "^1.0.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
